<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OzyRecon v5.6 - Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <style>

        body { background-color: #050a10; color: #e2e8f0; }
        .cyber-border { border: 1px solid #00ff88; box-shadow: 0 0 10px rgba(0, 255, 136, 0.2); }
        .neon-text { color: #00ff88; text-shadow: 0 0 5px rgba(0, 255, 136, 0.5); }
        .gate-border { border: 1px solid #00d4ff; box-shadow: 0 0 10px rgba(0, 212, 255, 0.2); }
    </style>
</head>
<body x-data="dashboard()">
    <nav class="p-6 border-b border-gray-800 bg-[#0a0f1a]">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold neon-text">OZYRECON <span class="text-xs text-gray-500">v5.6 ASSISTED VALIDATION</span></h1>
            <div class="flex gap-4">
                <span class="px-3 py-1 bg-green-900 text-green-400 rounded-full text-xs">SYSTEM READY</span>
                <span class="text-gray-400 text-sm" x-text="new Date().toLocaleTimeString()"></span>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-8 grid grid-cols-1 lg:grid-cols-4 gap-8">
        <!-- Panel de Inteligencia (Izquierda) -->
        <div class="lg:col-span-1 space-y-6">
            <section class="p-6 bg-[#0d1526] rounded-xl cyber-border">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2">🧠 Inteligencia</h2>
                <div class="space-y-4">
                    <template x-for="(weight, key) in intel.weights" :key="key">
                        <div>
                            <div class="flex justify-between text-xs mb-1">
                                <span class="capitalize" x-text="key.replace('_', ' ')"></span>
                                <span x-text="(weight * 100).toFixed(0) + '%'"></span>
                            </div>
                            <div class="w-full bg-gray-800 rounded-full h-1.5">
                                <div class="bg-[#00ff88] h-1.5 rounded-full" :style="'width: ' + (weight * 100) + '%'"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </section>

            <section class="p-6 bg-[#0d1526] rounded-xl border border-gray-800">
                <h2 class="text-lg font-bold mb-4">Métricas Globales</h2>
                <div class="grid grid-cols-2 gap-4 text-center">
                    <div class="p-3 bg-[#0a0f1a] rounded-lg">
                        <p class="text-xs text-gray-500">Precisión</p>
                        <p class="text-xl font-bold neon-text" x-text="(intel.metrics.decision_accuracy_rate * 100).toFixed(1) + '%'"></p>
                    </div>
                    <div class="p-3 bg-[#0a0f1a] rounded-lg">
                        <p class="text-xs text-gray-500">Decisiones</p>
                        <p class="text-xl font-bold" x-text="intel.metrics.total_decisions"></p>
                    </div>
                </div>
            </section>
        </div>

        <!-- HUMAN GATE (Centro - Mayor foco) -->
        <div class="lg:col-span-2 space-y-6">
            <section class="p-6 bg-[#0d1526] rounded-xl gate-border">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold flex items-center gap-2">
                        <span class="text-[#00d4ff]">🛡️</span> Human Gate <span class="text-xs font-normal text-gray-500" x-text="pending.length + ' pendientes'"></span>
                    </h2>
                    <button @click="loadData()" class="text-xs text-[#00d4ff] hover:underline">Actualizar</button>
                </div>

                <div class="space-y-4">
                    <template x-for="h in pending" :key="h.id">
                        <div class="p-5 bg-[#0a0f1a] rounded-lg border border-gray-800 hover:border-[#00d4ff] transition-all">
                            <div class="flex justify-between items-start mb-3">
                                <div>
                                    <h3 class="font-bold text-[#00d4ff] uppercase tracking-wider text-sm" x-text="h.type"></h3>
                                    <p class="text-xs text-gray-500 font-mono" x-text="h.id"></p>
                                </div>
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold" 
                                      :class="h.risk === 'high' ? 'bg-red-900 text-red-300' : 'bg-yellow-900 text-yellow-300'"
                                      x-text="h.risk.toUpperCase()"></span>
                            </div>
                            <p class="text-sm text-gray-300 mb-4" x-text="h.description"></p>
                            
                            <div class="flex items-center gap-4 mb-5 text-xs">
                                <div class="bg-gray-800 px-2 py-1 rounded">Confianza: <span class="text-white" x-text="(h.confidence * 100).toFixed(1) + '%'"></span></div>
                                <div class="text-gray-500">Target ID: <span x-text="h.target"></span></div>
                            </div>

                            <div class="flex gap-3">
                                <button @click="approve(h.id)" class="flex-1 bg-blue-700 hover:bg-blue-600 text-white text-xs font-bold py-2 rounded transition shadow-lg">APPROVE VALIDATION</button>
                                <button @click="reject(h.id)" class="px-4 bg-gray-800 hover:bg-gray-700 text-white text-xs font-bold py-2 rounded transition">REJECT</button>
                            </div>
                        </div>
                    </template>
                    <template x-if="pending.length === 0">
                        <div class="text-center py-12 text-gray-600">
                            <p class="text-3xl mb-2">🏖️</p>
                            <p>No hay hipótesis pendientes de revisión.</p>
                        </div>
                    </template>
                </div>
            </section>
        </div>

        <!-- Panel de Targets (Derecha) -->
        <div class="lg:col-span-1 space-y-6">
            <section class="p-6 bg-[#0d1526] rounded-xl border border-gray-800">
                <h2 class="text-lg font-bold mb-4">Últimos Targets</h2>
                <div class="space-y-3">
                    <template x-for="target in targets.slice(0, 5)" :key="target.id">
                        <div class="p-3 bg-[#0a0f1a] rounded-lg border border-gray-800">
                            <p class="text-sm font-mono truncate" x-text="target.domain"></p>
                            <p class="text-[10px] text-gray-500" x-text="new Date(target.added_at).toLocaleDateString()"></p>
                        </div>
                    </template>
                </div>
            </section>
        </div>
    </main>

    <!-- KNOWLEDGE GRAPH SECTION v5.7 -->
    <section class="container mx-auto p-8 pt-0">
        <div class="p-6 bg-[#0d1526] rounded-xl border border-gray-800">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2">🌐 Knowledge Graph <span class="text-xs font-normal text-gray-500">Superficie de Ataque Correlacionada</span></h2>
            <div id="cy" class="w-full h-[500px] bg-[#050a10] rounded-lg border border-gray-900"></div>
        </div>
    </section>

    <script>

        function dashboard() {
            return {
                intel: { weights: {}, metrics: {} },
                targets: [],
                pending: [],
                async loadData() {
                    try {
                        const intelRes = await fetch('/intelligence/status');
                        this.intel = await intelRes.json();
                        const targetRes = await fetch('/targets');
                        this.targets = await targetRes.json();
                        const pendingRes = await fetch('/gate/pending');
                        this.pending = await pendingRes.json();
                    } catch (e) {
                        console.error("Error cargando data:", e);
                    }
                },
                async approve(id) {
                    if (confirm('Autorizar validación para ' + id + '?')) {
                        await fetch('/gate/approve/' + id, { method: 'POST' });
                        this.loadData();
                    }
                },
                async reject(id) {
                    const reason = prompt('Razón del rechazo:');
                    if (reason) {
                        await fetch('/gate/reject/' + id + '?reason=' + encodeURIComponent(reason), { method: 'POST' });
                        this.loadData();
                    }
                },
                async init() {
                    this.loadData();
                    setInterval(() => this.loadData(), 15000);
                    
                    // Inicializar Grafo
                    setTimeout(() => this.initGraph(), 1000);
                },
                async initGraph() {
                    const res = await fetch('/intelligence/graph');
                    const elements = await res.json();
                    
                    const cy = cytoscape({
                        container: document.getElementById('cy'),
                        elements: elements,
                        style: [
                            {
                                selector: 'node',
                                style: {
                                    'background-color': 'data(color)',
                                    'label': 'data(label)',
                                    'color': '#fff',
                                    'font-size': '10px',
                                    'text-valign': 'bottom',
                                    'text-margin-y': '5px'
                                }
                            },
                            {
                                selector: 'edge',
                                style: {
                                    'width': 1,
                                    'line-color': '#334155',
                                    'target-arrow-color': '#334155',
                                    'target-arrow-shape': 'triangle',
                                    'curve-style': 'bezier',
                                    'font-size': '8px',
                                    'label': 'data(label)',
                                    'color': '#64748b'
                                }
                            }
                        ],
                        layout: {
                            name: 'cose',
                            animate: true
                        }
                    });
                }
            }
        }
    </script>

</body>
</html>
