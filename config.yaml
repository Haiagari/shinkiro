# Shinkiro — Ephemeral Deception & Attacker Intelligence Mesh Configuration

node_name: "shinkiro-sensor-primary"
idle_timeout: 30s
max_connections: 1000
audit_log_path: "data/events.jsonl"
metrics_port: 9100

services:
