# Shinkiro - local Compose stack
# Build context is the repo root. Default image config enables all decoys in config.yaml.
#
#   make docker-build && make compose-up          # baked config (backward compatible)
#   make compose-lab                             # lab mode overlay (demo mounts)
#   make compose-edge                            # edge mode overlay (hardened)
#   # or:
#   docker compose -f deploy/docker/docker-compose.yml up --build
#   docker compose -f deploy/docker/docker-compose.yml -f deploy/docker/compose.lab.yml up -d
#   docker compose -f deploy/docker/docker-compose.yml -f deploy/docker/compose.edge.yml up -d
#
# Modes: see deploy/modes/README.md

services:
  shinkiro:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: shinkiro:local
    container_name: shinkiro-mesh
    restart: unless-stopped
    working_dir: /app
    # ENTRYPOINT is /usr/local/bin/shinkiro; default CMD is "up"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      # Ports match enabled services in default config.yaml (+ metrics)
      - "502:502"       # Modbus / TCP
      - "1053:1053"     # DNS (TCP listen via multiplexer)
      - "1883:1883"     # MQTT
      - "2222:2222"     # SSH
      - "2323:2323"     # Telnet
      - "2375:2375"     # Docker API
      - "2525:2525"     # SMTP
      - "4445:4445"     # SMB
      - "5432:5432"     # PostgreSQL
      - "6379:6379"     # Redis
      - "6443:6443"     # Kubernetes API
      - "8080:8080"     # HTTP traps
      - "8169:8169"     # AWS IMDS
      - "9100:9100"     # Prometheus metrics
      - "9200:9200"     # Elasticsearch
      - "27017:27017"   # MongoDB
    volumes:
      # Persist audit log at data/events.jsonl (CWD-relative path in config)
      - ./data:/app/data
      # Optional host overrides (baked image already includes defaults):
      # - ../../config.yaml:/app/config.yaml:ro
      # - ../../playbooks.yaml:/app/playbooks.yaml:ro
    environment:
      SHINKIRO_NODE: shinkiro-cloud-sensor-01
