# Edge overlay — hardened defaults, quieter PCAP gate, dry-run SOAR.
# Requires Compose v2.24+ for !override on cap_add (clears base NET_ADMIN/NET_RAW).
# Usage: docker compose -f deploy/docker/docker-compose.yml -f deploy/docker/compose.edge.yml up -d
# Or: make compose-edge
#
# Privileges: NET_BIND_SERVICE only (Modbus :502). No NET_ADMIN — live firewall
# apply is not enabled in this overlay. Optional host --apply needs a custom overlay.

services:
  shinkiro:
    container_name: shinkiro-edge
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: !override
      - NET_BIND_SERVICE
    environment:
      SHINKIRO_NODE: shinkiro-edge-sensor-01
      SHINKIRO_PCAP_THRESHOLD: "90"
      # Intentionally omit SHINKIRO_SOAR_APPLY (dry-run)
    volumes:
      - ../modes/edge/config.yaml:/app/config.yaml:ro
      - ../modes/edge/playbooks.yaml:/app/playbooks.yaml:ro
      - ./data-edge:/app/data
    labels:
      shinkiro.deploy.mode: edge
