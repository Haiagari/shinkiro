# Edge overlay for deploy/helm/shinkiro
# Pair with: --set-file configOverride=deploy/modes/edge/config.yaml
#            --set-file playbooksOverride=deploy/modes/edge/playbooks.yaml
# Or: make helm-edge
#
# Hardened defaults: dry-run SOAR, higher PCAP threshold, stricter resources.
# Image still defaults to local tag unless you set repository to ghcr.io/haiagari/shinkiro
# after enabling optional GHCR publish (repo variable PUSH_GHCR=true).

deployMode: edge

env:
  SHINKIRO_NODE_NAME: "shinkiro-edge-sensor"
  SHINKIRO_PCAP_THRESHOLD: "90"
  # Intentionally omit SHINKIRO_SOAR_APPLY (dry-run)

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534
