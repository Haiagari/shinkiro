apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-shinkiro
  labels:
    app.kubernetes.io/name: shinkiro
    app.kubernetes.io/instance: {{ .Release.Name }}
    shinkiro.deploy.mode: {{ .Values.deployMode | default "lab" | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: shinkiro
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shinkiro
        app.kubernetes.io/instance: {{ .Release.Name }}
        shinkiro.deploy.mode: {{ .Values.deployMode | default "lab" | quote }}
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        {{- if and .Values.seccomp.enabled .Values.seccomp.profile }}
        seccompProfile:
          {{- toYaml .Values.seccomp.profile | nindent 10 }}
        {{- end }}
      containers:
        - name: shinkiro
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /app
          command: ["/usr/local/bin/shinkiro", "up"]
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            {{- range $name, $port := .Values.service.ports }}
            - name: {{ $name }}
              containerPort: {{ $port }}
              protocol: TCP
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
                {{- toYaml .Values.securityContext.capabilities.drop | nindent 16 }}
              {{- with .Values.securityContext.capabilities.add }}
              add:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp-storage
              mountPath: /tmp
            - name: data-storage
              mountPath: /app/data
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config
              mountPath: /app/playbooks.yaml
              subPath: playbooks.yaml
              readOnly: true
            {{- if .Values.seccomp.mountProfile }}
            - name: seccomp
              mountPath: /etc/shinkiro/seccomp.json
              subPath: seccomp.json
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp-storage
          emptyDir: {}
        - name: data-storage
          emptyDir: {}
        - name: config
          configMap:
            name: {{ .Release.Name }}-shinkiro-config
        {{- if .Values.seccomp.mountProfile }}
        - name: seccomp
          configMap:
            name: {{ .Release.Name }}-shinkiro-seccomp
        {{- end }}
