apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-shinkiro
  labels:
    app.kubernetes.io/name: shinkiro
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: shinkiro
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shinkiro
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
      containers:
        - name: shinkiro
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/shinkiro", "up"]
          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp-storage
              mountPath: /tmp
            - name: data-storage
              mountPath: /data
      volumes:
        - name: tmp-storage
          emptyDir: {}
        - name: data-storage
          emptyDir: {}
