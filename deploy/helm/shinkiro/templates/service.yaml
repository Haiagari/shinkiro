apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-shinkiro
  labels:
    app.kubernetes.io/name: shinkiro
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: shinkiro
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    {{- range $name, $port := .Values.service.ports }}
    - name: {{ $name }}
      port: {{ $port }}
      targetPort: {{ $port }}
      protocol: TCP
    {{- end }}
