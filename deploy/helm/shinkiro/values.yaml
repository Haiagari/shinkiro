# Default values for Shinkiro Cyber Deception Mesh
replicaCount: 1

image:
  # Default: local image (make docker-build → shinkiro:local).
  # Optional GHCR: only when release CI has PUSH_GHCR=true (repo variable).
  #   repository: ghcr.io/haiagari/shinkiro
  #   tag: <release tag e.g. v1.1.0>
  #   pullPolicy: IfNotPresent
  # Build locally, then load into your cluster:
  #   make docker-build
  #   kind load docker-image shinkiro:local
  #   helm install shinkiro ./deploy/helm/shinkiro \
  #     --set image.repository=shinkiro --set image.tag=local
  repository: shinkiro
  pullPolicy: IfNotPresent
  tag: "local"

service:
  type: ClusterIP
  # Ports mirror enabled services in chart files/config.yaml (+ metrics)
  ports:
    modbus: 502
    dns: 1053
    mqtt: 1883
    ssh: 2222
    telnet: 2323
    docker: 2375
    smtp: 2525
    smb: 4445
    postgres: 5432
    redis: 6379
    k8s: 6443
    http: 8080
    awsimds: 8169
    metrics: 9100
    elastic: 9200
    mongo: 27017

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    # Needed to bind Modbus :502 (<1024) when runAsNonRoot
    add:
      - NET_BIND_SERVICE
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534

# Runtime config uses top-level key services: (not decoys:).
# Chart mounts files/config.yaml + files/playbooks.yaml into /app via ConfigMap.
env:
  SHINKIRO_NODE_NAME: "shinkiro-k8s-mesh-sensor"

seccomp:
  # Apply RuntimeDefault at the pod level. Optionally mount the JSON profile
  # (from deploy/security/seccomp.json via chart files/) for operators who
  # install a Localhost profile on nodes later.
  enabled: true
  mountProfile: true
  profile:
    type: RuntimeDefault

# ---------------------------------------------------------------------------
# Deploy mode (lab | edge) — informational label + selects recommended overlays.
# Use values-lab.yaml / values-edge.yaml and --set-file for mode configs:
#   see deploy/modes/README.md
# ---------------------------------------------------------------------------
deployMode: lab

# When non-empty (e.g. helm --set-file configOverride=deploy/modes/edge/config.yaml),
# these replace the chart-baked files/config.yaml and files/playbooks.yaml.
configOverride: ""
playbooksOverride: ""
