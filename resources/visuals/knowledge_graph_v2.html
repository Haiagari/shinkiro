<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptWall // Threat Intelligence Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#010408;
  --deep:#060d15;
  --panel:rgba(6,13,21,0.92);
  --cyan:#00d4ff;
  --cyan2:#00a8cc;
  --green:#00ff88;
  --red:#ff2444;
  --orange:#ff6b35;
  --amber:#ffb800;
  --dim:#1a2d3d;
  --muted:#2a4a64;
  --text:#c8dde8;
  --text2:#5a8099;
  --mono:'Share Tech Mono',monospace;
  --display:'Orbitron',sans-serif;
  --ui:'Rajdhani',sans-serif;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--void);color:var(--text);font-family:var(--mono)}
canvas#matrix{position:fixed;inset:0;opacity:.04;pointer-events:none;z-index:0}
svg#graph{position:fixed;inset:0;z-index:1}

/* ── HEX GRID BACKGROUND ── */
svg#graph defs .hex-pattern{opacity:.06}

/* ── TOP BAR ── */
#topbar{
  position:fixed;top:0;left:0;right:0;height:56px;
  background:var(--panel);
  border-bottom:1px solid rgba(0,212,255,.15);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;z-index:100;backdrop-filter:blur(10px);
}
.brand{font-family:var(--display);font-size:16px;letter-spacing:4px;color:var(--cyan);text-shadow:0 0 20px rgba(0,212,255,.5)}
.brand sub{font-size:9px;letter-spacing:2px;color:var(--text2);vertical-align:super}
.topbar-stats{display:flex;gap:32px}
.tstat{display:flex;flex-direction:column;align-items:center}
.tstat-val{font-family:var(--display);font-size:18px;font-weight:700}
.tstat-lbl{font-size:8px;letter-spacing:2px;color:var(--text2)}
.tstat.red .tstat-val{color:var(--red);text-shadow:0 0 10px rgba(255,36,68,.4)}
.tstat.amber .tstat-val{color:var(--amber)}
.tstat.cyan .tstat-val{color:var(--cyan)}
.tstat.green .tstat-val{color:var(--green)}
.topbar-right{display:flex;align-items:center;gap:16px}
.pulse-ring{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse-anim 1.8s ease infinite}
@keyframes pulse-anim{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.status-txt{font-size:10px;letter-spacing:2px;color:var(--green)}
#clock{font-size:11px;color:var(--text2);letter-spacing:1px}

/* ── SIDE PANEL ── */
#panel{
  position:fixed;top:56px;right:0;bottom:160px;width:300px;
  background:var(--panel);border-left:1px solid rgba(0,212,255,.15);
  padding:20px;overflow-y:auto;z-index:90;
  backdrop-filter:blur(10px);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
}
#panel.open{transform:translateX(0)}
.panel-close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--text2);font-size:16px;cursor:pointer;font-family:var(--mono)}
.panel-close:hover{color:var(--cyan)}
.panel-eyebrow{font-size:8px;letter-spacing:3px;color:var(--text2);margin-bottom:8px}
.panel-title{font-family:var(--display);font-size:14px;letter-spacing:2px;margin-bottom:4px;word-break:break-all}
.panel-detail{font-size:11px;color:var(--text2);line-height:1.8;margin-bottom:16px}
.panel-risk{display:inline-block;padding:3px 12px;border-radius:2px;font-size:9px;letter-spacing:2px;margin-bottom:16px}
.risk-CRITICAL{background:rgba(255,36,68,.15);color:var(--red);border:1px solid rgba(255,36,68,.4)}
.risk-HIGH{background:rgba(255,107,53,.12);color:var(--orange);border:1px solid rgba(255,107,53,.35)}
.risk-MEDIUM{background:rgba(255,184,0,.1);color:var(--amber);border:1px solid rgba(255,184,0,.3)}
.risk-LOW{background:rgba(0,212,255,.08);color:var(--cyan);border:1px solid rgba(0,212,255,.2)}
.risk-ACTIVE{background:rgba(0,255,136,.08);color:var(--green);border:1px solid rgba(0,255,136,.3)}
.panel-divider{border:none;border-top:1px solid rgba(0,212,255,.1);margin:12px 0}
.panel-section-lbl{font-size:8px;letter-spacing:3px;color:var(--text2);margin-bottom:8px}
.conn-list{display:flex;flex-direction:column;gap:6px}
.conn-item{font-size:10px;color:var(--text2);padding:5px 8px;background:rgba(0,212,255,.04);border:1px solid rgba(0,212,255,.08);border-radius:3px;cursor:pointer}
.conn-item:hover{border-color:rgba(0,212,255,.25);color:var(--cyan)}

/* ── CONSOLE ── */
#console{
  position:fixed;left:0;right:0;bottom:0;height:160px;
  background:var(--panel);border-top:1px solid rgba(0,212,255,.15);
  backdrop-filter:blur(10px);z-index:100;overflow:hidden;
}
.console-header{
  display:flex;align-items:center;gap:10px;
  padding:8px 16px;border-bottom:1px solid rgba(0,212,255,.08);
}
.console-dot{width:8px;height:8px;border-radius:50%;animation:pulse-anim 2s ease infinite}
.console-dot.r{background:var(--red);box-shadow:0 0 6px var(--red);animation-delay:.2s}
.console-dot.a{background:var(--amber);box-shadow:0 0 6px var(--amber);animation-delay:.6s}
.console-dot.g{background:var(--green);box-shadow:0 0 6px var(--green);animation-delay:1s}
.console-lbl{font-family:var(--display);font-size:8px;letter-spacing:3px;color:var(--text2);flex:1}
.console-scroll{
  height:calc(160px - 38px);overflow-y:auto;padding:8px 16px;
  display:flex;flex-direction:column;gap:2px;
}
.console-scroll::-webkit-scrollbar{width:3px}
.console-scroll::-webkit-scrollbar-thumb{background:var(--muted)}
.log-line{font-size:10px;letter-spacing:.5px;opacity:0;animation:fadein .4s ease forwards}
@keyframes fadein{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}
.log-line .ts{color:var(--muted);margin-right:8px}
.log-CRIT{color:var(--red)}
.log-HIGH{color:var(--orange)}
.log-WARN{color:var(--amber)}
.log-INFO{color:var(--text2)}
.log-SYS{color:var(--green)}
.log-SCAN{color:var(--cyan2)}

/* ── LEGEND ── */
#legend{
  position:fixed;left:16px;bottom:172px;
  background:var(--panel);border:1px solid rgba(0,212,255,.12);
  border-radius:6px;padding:12px 16px;z-index:90;backdrop-filter:blur(10px);
}
.legend-title{font-size:8px;letter-spacing:3px;color:var(--text2);margin-bottom:10px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--text2);margin-bottom:6px}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend-diamond{width:10px;height:10px;transform:rotate(45deg);flex-shrink:0}

/* ── TOOLTIP ── */
#tooltip{
  position:fixed;pointer-events:none;z-index:200;
  background:rgba(6,13,21,.95);border:1px solid rgba(0,212,255,.3);
  padding:8px 12px;border-radius:4px;font-size:10px;
  display:none;max-width:200px;
}

/* ── SCAN FLASH ── */
@keyframes scanflash{
  0%{opacity:0;transform:translateY(-100%)}
  10%{opacity:.15}
  90%{opacity:.08}
  100%{opacity:0;transform:translateY(100vh)}
}
.scanline{
  position:fixed;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  animation:scanflash 5s linear infinite;z-index:50;pointer-events:none;top:0;
}

/* ── ZOOM CONTROLS ── */
#zoom-ctrl{
  position:fixed;left:16px;top:70px;z-index:90;
  display:flex;flex-direction:column;gap:4px;
}
.zbtn{
  width:32px;height:32px;background:var(--panel);
  border:1px solid rgba(0,212,255,.2);border-radius:4px;
  color:var(--cyan);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);transition:.15s;
}
.zbtn:hover{border-color:rgba(0,212,255,.5);background:rgba(0,212,255,.06)}
</style>
</head>
<body>

<!-- Matrix rain canvas -->
<canvas id="matrix"></canvas>

<!-- Scan line sweep -->
<div class="scanline"></div>

<!-- Top bar -->
<div id="topbar">
  <div class="brand">OZYRECON <sub>THREAT GRAPH</sub></div>
  <div class="topbar-stats">
    <div class="tstat red"><span class="tstat-val" id="cnt-crit">0</span><span class="tstat-lbl">CRITICAL</span></div>
    <div class="tstat amber"><span class="tstat-val" id="cnt-high">0</span><span class="tstat-lbl">HIGH</span></div>
    <div class="tstat cyan"><span class="tstat-val" id="cnt-nodes">0</span><span class="tstat-lbl">NODES</span></div>
    <div class="tstat green"><span class="tstat-val" id="cnt-edges">0</span><span class="tstat-lbl">LINKS</span></div>
  </div>
  <div class="topbar-right">
    <div class="pulse-ring"></div>
    <span class="status-txt">LIVE SCAN</span>
    <span id="clock"></span>
  </div>
</div>

<!-- Zoom controls -->
<div id="zoom-ctrl">
  <button class="zbtn" id="zoom-in">+</button>
  <button class="zbtn" id="zoom-out">−</button>
  <button class="zbtn" id="zoom-fit" title="Reset">⊙</button>
</div>

<!-- Graph SVG -->
<svg id="graph"></svg>

<!-- Side panel -->
<div id="panel">
  <button class="panel-close" id="close-panel">✕</button>
  <div class="panel-eyebrow">NODE INTELLIGENCE</div>
  <div class="panel-title" id="panel-title">—</div>
  <div class="panel-detail" id="panel-detail">—</div>
  <div class="panel-risk" id="panel-risk">—</div>
  <hr class="panel-divider">
  <div class="panel-section-lbl">CONNECTED NODES</div>
  <div class="conn-list" id="conn-list"></div>
</div>

<!-- Legend -->
<div id="legend">
  <div class="legend-title">NODE TYPES</div>
  <div class="legend-item"><div class="legend-dot" style="background:#00ff88;box-shadow:0 0 8px #00ff88"></div>Domain</div>
  <div class="legend-item"><div class="legend-dot" style="background:#00d4ff;box-shadow:0 0 6px #00d4ff"></div>Subdomain</div>
  <div class="legend-item"><div class="legend-dot" style="background:#a78bfa;box-shadow:0 0 6px #a78bfa"></div>Service / Cloud</div>
  <div class="legend-item"><div class="legend-diamond" style="background:#ff2444;box-shadow:0 0 8px #ff2444"></div>Vulnerability</div>
</div>

<!-- Console -->
<div id="console">
  <div class="console-header">
    <div class="console-dot r"></div>
    <div class="console-dot a"></div>
    <div class="console-dot g"></div>
    <span class="console-lbl">OZYRECON TERMINAL // LIVE EVENT LOG</span>
  </div>
  <div class="console-scroll" id="console-scroll"></div>
</div>

<!-- Tooltip -->
<div id="tooltip"></div>

<script>
// ── DATA ────────────────────────────────────────────────────────────────────
const RAW = {"nodes": [{"id": "root", "label": "enterprise.com", "type": "domain", "detail": "Primary Attack Surface", "risk": "ACTIVE"}, {"id": "sub1", "label": "api.enterprise.com", "type": "subdomain", "detail": "REST API Gateway \u00b7 Port 443/8443", "risk": "HIGH"}, {"id": "sub2", "label": "vpn.enterprise.com", "type": "subdomain", "detail": "OpenVPN \u00b7 WireGuard Endpoint", "risk": "MEDIUM"}, {"id": "sub3", "label": "dev.enterprise.com", "type": "subdomain", "detail": "Dev Environment \u00b7 Exposed Staging", "risk": "CRITICAL"}, {"id": "sub4", "label": "mail.enterprise.com", "type": "subdomain", "detail": "Exchange 2019 \u00b7 SMTP/IMAP", "risk": "MEDIUM"}, {"id": "sub5", "label": "cdn.enterprise.com", "type": "subdomain", "detail": "CloudFront Distribution", "risk": "LOW"}, {"id": "srv1", "label": "Jenkins v2.414", "type": "service", "detail": "CI/CD \u00b7 CVE-2024-23897 Exposed", "risk": "CRITICAL"}, {"id": "srv2", "label": "Nginx 1.18.0", "type": "service", "detail": "Reverse Proxy \u00b7 TLS 1.0 Enabled", "risk": "MEDIUM"}, {"id": "srv3", "label": "AWS S3 Bucket", "type": "cloud", "detail": "s3://ent-backups-prod \u00b7 Public ACL", "risk": "CRITICAL"}, {"id": "srv4", "label": "PostgreSQL 12.3", "type": "service", "detail": "DB Port 5432 \u00b7 Reachable Externally", "risk": "HIGH"}, {"id": "srv5", "label": "Redis 6.0", "type": "service", "detail": "No-Auth Mode \u00b7 Port 6379 Open", "risk": "HIGH"}, {"id": "vuln1", "label": "RCE via Jenkins", "type": "critical", "detail": "CVE-2024-23897 \u00b7 CVSS 9.8 \u00b7 Verified", "risk": "CRITICAL"}, {"id": "vuln2", "label": "S3 Data Exposure", "type": "critical", "detail": "PII + SSH Keys Leaked \u00b7 4.2GB", "risk": "CRITICAL"}, {"id": "vuln3", "label": "SQL Injection", "type": "high", "detail": "Parameter: /api/users?id= \u00b7 Blind", "risk": "HIGH"}, {"id": "vuln4", "label": "Subdomain Takeover", "type": "high", "detail": "CNAME \u2192 Unclaimed GitHub Pages", "risk": "HIGH"}, {"id": "vuln5", "label": "Redis Unauthenticated", "type": "high", "detail": "Full DB Read/Write Access", "risk": "HIGH"}], "edges": [{"source": "root", "target": "sub1"}, {"source": "root", "target": "sub2"}, {"source": "root", "target": "sub3"}, {"source": "root", "target": "sub4"}, {"source": "root", "target": "sub5"}, {"source": "sub3", "target": "srv1"}, {"source": "sub1", "target": "srv2"}, {"source": "sub3", "target": "srv3"}, {"source": "sub1", "target": "srv4"}, {"source": "sub1", "target": "srv5"}, {"source": "srv1", "target": "vuln1"}, {"source": "srv3", "target": "vuln2"}, {"source": "srv4", "target": "vuln3"}, {"source": "sub5", "target": "vuln4"}, {"source": "srv5", "target": "vuln5"}, {"source": "srv2", "target": "sub4"}]};

const nodes = RAW.nodes.map(n => ({...n}));
const edges = RAW.edges.map(e => ({...e}));

// ── COUNTERS ─────────────────────────────────────────────────────────────────
function animCounter(el, target, delay) {
  let v = 0;
  const step = Math.ceil(target / 20);
  setTimeout(() => {
    const t = setInterval(() => {
      v = Math.min(v + step, target);
      el.textContent = v;
      if (v >= target) clearInterval(t);
    }, 40);
  }, delay);
}
animCounter(document.getElementById('cnt-crit'),
  nodes.filter(n => n.risk === 'CRITICAL').length, 800);
animCounter(document.getElementById('cnt-high'),
  nodes.filter(n => n.risk === 'HIGH').length, 1000);
animCounter(document.getElementById('cnt-nodes'), nodes.length, 600);
animCounter(document.getElementById('cnt-edges'), edges.length, 700);

// ── CLOCK ────────────────────────────────────────────────────────────────────
function tick() {
  document.getElementById('clock').textContent =
    new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
}
tick(); setInterval(tick, 1000);

// ── MATRIX RAIN ──────────────────────────────────────────────────────────────
(function() {
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノ!@#$%^&*<>';
  let cols, drops;
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    cols = Math.floor(canvas.width / 16);
    drops = Array(cols).fill(1);
  }
  resize();
  window.addEventListener('resize', resize);
  setInterval(() => {
    ctx.fillStyle = 'rgba(1,4,8,0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00d4ff';
    ctx.font = '12px Share Tech Mono';
    drops.forEach((y, i) => {
      const ch = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(ch, i * 16, y * 16);
      if (y * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    });
  }, 60);
})();

// ── D3 GRAPH ─────────────────────────────────────────────────────────────────
const W = window.innerWidth, H = window.innerHeight;
const GRAPH_H = H - 56 - 160; // below topbar, above console

const svg = d3.select('#graph')
  .attr('width', W).attr('height', H);

// Defs
const defs = svg.append('defs');

// Glow filters
function makeGlow(id, color, blur) {
  const f = defs.append('filter').attr('id', id).attr('x', '-50%').attr('y', '-50%').attr('width','200%').attr('height','200%');
  f.append('feGaussianBlur').attr('in','SourceGraphic').attr('stdDeviation', blur).attr('result','blur');
  f.append('feColorMatrix').attr('in','blur').attr('type','matrix')
    .attr('values',`0 0 0 0 ${parseInt(color.slice(1,3),16)/255}  0 0 0 0 ${parseInt(color.slice(3,5),16)/255}  0 0 0 0 ${parseInt(color.slice(5,7),16)/255}  0 0 0 18 -7`).attr('result','glow');
  const merge = f.append('feMerge');
  merge.append('feMergeNode').attr('in','glow');
  merge.append('feMergeNode').attr('in','SourceGraphic');
}
makeGlow('glow-cyan',   '#00d4ff', 3);
makeGlow('glow-green',  '#00ff88', 4);
makeGlow('glow-red',    '#ff2444', 5);
makeGlow('glow-orange', '#ff6b35', 3);
makeGlow('glow-violet', '#a78bfa', 3);

// Arrow marker
defs.append('marker').attr('id','arrow').attr('viewBox','0 -4 8 8')
  .attr('refX',22).attr('refY',0).attr('markerWidth',6).attr('markerHeight',6)
  .attr('orient','auto')
  .append('path').attr('d','M0,-4L8,0L0,4').attr('fill','rgba(0,212,255,.4)');

// Hex grid pattern
const hexPat = defs.append('pattern').attr('id','hexgrid').attr('width',60).attr('height',52)
  .attr('patternUnits','userSpaceOnUse');
hexPat.append('path').attr('d','M30 0 L60 15 L60 37 L30 52 L0 37 L0 15 Z')
  .attr('fill','none').attr('stroke','rgba(0,212,255,0.06)').attr('stroke-width','0.8');

// Background layers
svg.append('rect').attr('width',W).attr('height',H).attr('fill','url(#hexgrid)');

// Clip for graph area
defs.append('clipPath').attr('id','graph-clip')
  .append('rect').attr('y',56).attr('width',W).attr('height',GRAPH_H);

const container = svg.append('g').attr('clip-path','url(#graph-clip)');
const g = container.append('g').attr('transform',`translate(0,56)`);

// Zoom behavior
const zoom = d3.zoom().scaleExtent([0.2, 3])
  .on('zoom', (e) => g.attr('transform', `translate(${e.transform.x},${e.transform.y + 56}) scale(${e.transform.k})`));
svg.call(zoom);

document.getElementById('zoom-in').onclick  = () => svg.transition().call(zoom.scaleBy, 1.3);
document.getElementById('zoom-out').onclick = () => svg.transition().call(zoom.scaleBy, 0.77);
document.getElementById('zoom-fit').onclick = () => svg.transition().call(zoom.transform, d3.zoomIdentity.translate(W/2, GRAPH_H/2).scale(0.9));

// ── SIMULATION ───────────────────────────────────────────────────────────────
const sim = d3.forceSimulation(nodes)
  .force('link',   d3.forceLink(edges).id(d => d.id).distance(d => {
    if (d.source.type === 'domain' || d.target.type === 'domain') return 160;
    if (d.target.type === 'critical' || d.target.type === 'high') return 100;
    return 130;
  }).strength(0.4))
  .force('charge', d3.forceManyBody().strength(-320))
  .force('center', d3.forceCenter(W / 2, GRAPH_H / 2))
  .force('collide', d3.forceCollide().radius(d => nodeR(d) + 20))
  .alphaDecay(0.018);

// ── NODE CONFIG ───────────────────────────────────────────────────────────────
function nodeR(d) {
  return {domain:28,subdomain:18,service:16,cloud:18,critical:16,high:14}[d.type] || 14;
}
function nodeColor(d) {
  return {
    domain:   '#00ff88', subdomain: '#00d4ff',
    service:  '#a78bfa', cloud:     '#a78bfa',
    critical: '#ff2444', high:      '#ff6b35',
  }[d.type] || '#00d4ff';
}
function nodeGlow(d) {
  return {
    domain:   'url(#glow-green)', subdomain: 'url(#glow-cyan)',
    service:  'url(#glow-violet)', cloud:    'url(#glow-violet)',
    critical: 'url(#glow-red)',   high:      'url(#glow-orange)',
  }[d.type] || 'url(#glow-cyan)';
}
function nodeIcon(d) {
  const icons = {
    domain:   '◈', subdomain: '◉',
    service:  '⚙', cloud:     '☁',
    critical: '⚠', high:      '⚡',
  };
  // Override by label keyword
  if (d.label.includes('Jenkins')) return '⚙';
  if (d.label.includes('Nginx'))   return '⟁';
  if (d.label.includes('S3') || d.label.includes('AWS')) return '☁';
  if (d.label.includes('SQL') || d.label.includes('Post')) return '⛃';
  if (d.label.includes('Redis'))   return '⚡';
  if (d.label.includes('RCE') || d.label.includes('Code')) return '💀';
  if (d.label.includes('Takeover')) return '⚠';
  return icons[d.type] || '•';
}
function isDanger(d) {
  return d.type === 'critical' || d.type === 'high';
}

// ── EDGES ─────────────────────────────────────────────────────────────────────
const linkGroup = g.append('g').attr('class','links');

const link = linkGroup.selectAll('line')
  .data(edges).join('line')
  .attr('stroke', d => {
    const t = d.target.type || (typeof d.target === 'object' ? d.target.type : '');
    return (t === 'critical') ? 'rgba(255,36,68,.5)'
         : (t === 'high')     ? 'rgba(255,107,53,.4)'
         :                      'rgba(0,212,255,.2)';
  })
  .attr('stroke-width', d => {
    const t = d.target.type || (typeof d.target === 'object' ? d.target.type : '');
    return (t === 'critical' || t === 'high') ? 1.5 : 1;
  })
  .attr('stroke-dasharray', d => {
    const t = d.target.type || (typeof d.target === 'object' ? d.target.type : '');
    return (t === 'critical' || t === 'high') ? '6 3' : 'none';
  })
  .attr('marker-end','url(#arrow)');

// Animated dash offset for danger edges
function animDashes() {
  link.filter(d => (typeof d.target === 'object' ? d.target.type : d.target) === 'critical'
               || (typeof d.target === 'object' ? d.target.type : d.target) === 'high')
    .attr('stroke-dashoffset', (Date.now() / 40) % 18);
  requestAnimationFrame(animDashes);
}
animDashes();

// ── PARTICLES ─────────────────────────────────────────────────────────────────
const particles = [];
const partLayer = g.append('g').attr('class','particles');

function spawnParticle(edge) {
  const s = edge.source, t = edge.target;
  particles.push({
    sx: s.x, sy: s.y, tx: t.x, ty: t.y,
    progress: 0,
    speed: 0.004 + Math.random() * 0.004,
    color: isDanger(t) ? (t.type === 'critical' ? '#ff2444' : '#ff6b35') : '#00d4ff',
    el: partLayer.append('circle').attr('r', 2.5).attr('opacity', 0)
  });
}

// Seed initial particles
edges.forEach(e => { for(let i=0;i<2;i++) setTimeout(() => spawnParticle(e), Math.random()*3000); });
setInterval(() => {
  if (particles.length < 40) {
    const e = edges[Math.floor(Math.random() * edges.length)];
    if (typeof e.source === 'object' && e.source.x) spawnParticle(e);
  }
}, 800);

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.progress += p.speed;
    if (p.progress >= 1) {
      p.el.remove();
      particles.splice(i, 1);
      continue;
    }
    const t = p.progress;
    const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
    const x = p.sx + (p.tx - p.sx) * ease;
    const y = p.sy + (p.ty - p.sy) * ease;
    const fade = Math.sin(Math.PI * t);
    p.el.attr('cx', x).attr('cy', y)
      .attr('fill', p.color)
      .attr('opacity', fade * 0.85)
      .attr('filter', isDanger({type: p.color === '#ff2444' ? 'critical':'x'}) ? 'url(#glow-red)' : 'url(#glow-cyan)');
  }
  requestAnimationFrame(updateParticles);
}
updateParticles();

// ── NODES ─────────────────────────────────────────────────────────────────────
const nodeGroup = g.append('g').attr('class','nodes');

const node = nodeGroup.selectAll('g.node')
  .data(nodes).join('g')
  .attr('class','node').attr('cursor','pointer')
  .call(d3.drag()
    .on('start', (e, d) => { if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on('drag',  (e, d) => { d.fx=e.x; d.fy=e.y; })
    .on('end',   (e, d) => { if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; })
  )
  .on('click', (e, d) => { e.stopPropagation(); openPanel(d); })
  .on('mouseenter', (e, d) => showTooltip(e, d))
  .on('mousemove',  (e)    => moveTooltip(e))
  .on('mouseleave', ()     => hideTooltip());

// Outer pulse ring (danger nodes only)
node.filter(d => isDanger(d)).append('circle')
  .attr('class','pulse-outer')
  .attr('r', d => nodeR(d) + 8)
  .attr('fill','none')
  .attr('stroke', d => nodeColor(d))
  .attr('stroke-width', 1)
  .attr('opacity', 0.3);

// Expanding ring animation via CSS
const styleEl = document.createElement('style');
styleEl.textContent = `
  @keyframes ring-expand {
    0%  { r: 0px; opacity: 0.6; }
    100% { r: 50px; opacity: 0; }
  }
  .ring-anim { animation: ring-expand 2.4s ease-out infinite; }
  .ring-anim-2 { animation: ring-expand 2.4s ease-out 1.2s infinite; }
`;
document.head.appendChild(styleEl);

// SVG rings (danger only)
node.filter(d => isDanger(d)).append('circle')
  .attr('class','ring-anim').attr('fill','none')
  .attr('stroke', d => nodeColor(d)).attr('stroke-width', 1.5)
  .attr('opacity', 0);
node.filter(d => isDanger(d)).append('circle')
  .attr('class','ring-anim-2').attr('fill','none')
  .attr('stroke', d => nodeColor(d)).attr('stroke-width', 1)
  .attr('opacity', 0);

// Outer ring border
node.append('circle')
  .attr('r', d => nodeR(d) + 4)
  .attr('fill','none')
  .attr('stroke', d => nodeColor(d))
  .attr('stroke-width', 0.6)
  .attr('opacity', 0.3);

// Main body
node.append('circle')
  .attr('r', d => nodeR(d))
  .attr('fill', d => `${nodeColor(d)}18`)
  .attr('stroke', d => nodeColor(d))
  .attr('stroke-width', d => d.type === 'domain' ? 2.5 : 1.5)
  .attr('filter', d => nodeGlow(d));

// Icon
node.append('text')
  .attr('text-anchor','middle').attr('dominant-baseline','central')
  .attr('font-size', d => nodeR(d) * 0.9)
  .attr('fill', d => nodeColor(d))
  .attr('filter', d => nodeGlow(d))
  .attr('pointer-events','none')
  .text(d => nodeIcon(d));

// Label
node.append('text')
  .attr('text-anchor','middle')
  .attr('dy', d => nodeR(d) + 14)
  .attr('font-size', '9px')
  .attr('font-family','Share Tech Mono,monospace')
  .attr('fill', d => nodeColor(d))
  .attr('opacity', 0.85)
  .attr('pointer-events','none')
  .text(d => d.label.length > 22 ? d.label.slice(0,20)+'…' : d.label);

// ── SIMULATION TICK ───────────────────────────────────────────────────────────
sim.on('tick', () => {
  link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  node.attr('transform', d => `translate(${d.x},${d.y})`);
  // Update particle coords from live node positions
  particles.forEach(p => {
    const srcNode = nodes.find(n => n.x === p.sx && n.y === p.sy);
    // Refresh source/target if stable
  });
});

// ── TOOLTIP ───────────────────────────────────────────────────────────────────
const tip = document.getElementById('tooltip');
function showTooltip(e, d) {
  tip.innerHTML = `<strong style="color:${nodeColor(d)}">${d.label}</strong><br>
  <span style="color:#5a8099">${d.type.toUpperCase()} · ${d.risk}</span>`;
  tip.style.display = 'block';
  moveTooltip(e);
}
function moveTooltip(e) {
  tip.style.left = (e.clientX + 14) + 'px';
  tip.style.top  = (e.clientY - 10) + 'px';
}
function hideTooltip() { tip.style.display = 'none'; }
svg.on('click', () => closePanel());

// ── SIDE PANEL ────────────────────────────────────────────────────────────────
function openPanel(d) {
  document.getElementById('panel-title').textContent  = d.label;
  document.getElementById('panel-detail').textContent = d.detail;
  const rb = document.getElementById('panel-risk');
  rb.textContent = d.risk;
  rb.className = `panel-risk risk-${d.risk}`;
  // Connected nodes
  const conns = edges.filter(e =>
    (typeof e.source === 'object' ? e.source.id : e.source) === d.id ||
    (typeof e.target === 'object' ? e.target.id : e.target) === d.id
  ).map(e => {
    const other = (typeof e.source === 'object' ? e.source.id : e.source) === d.id
      ? (typeof e.target === 'object' ? e.target : nodes.find(n => n.id === e.target))
      : (typeof e.source === 'object' ? e.source : nodes.find(n => n.id === e.source));
    return other;
  }).filter(Boolean);
  const cl = document.getElementById('conn-list');
  cl.innerHTML = conns.map(n =>
    `<div class="conn-item" style="color:${nodeColor(n)}" onclick="openPanelById('${n.id}')">${n.label}</div>`
  ).join('');
  document.getElementById('panel').classList.add('open');
}
function openPanelById(id) {
  const d = nodes.find(n => n.id === id);
  if (d) openPanel(d);
}
function closePanel() { document.getElementById('panel').classList.remove('open'); }
document.getElementById('close-panel').onclick = closePanel;

// ── CONSOLE LOG ───────────────────────────────────────────────────────────────
const events = ["[SYS]  PromptWall Engine v5.7 \u2014 Session initialized", "[SCAN] Resolving DNS records for enterprise.com...", "[INFO] 5 subdomains discovered via Certificate Transparency", "[WARN] TLS 1.0 detected on mail.enterprise.com:443", "[CRIT] Jenkins CVE-2024-23897 \u2014 Remote file read confirmed", "[CRIT] S3 bucket enterprise-backups-prod \u2014 Public ACL active", "[HIGH] Redis instance 127.0.0.1:6379 \u2014 No authentication required", "[HIGH] SQL injection confirmed on /api/users endpoint", "[INFO] Force-graph layout stabilized \u2014 16 nodes rendered", "[SCAN] Initiating port scan on identified IP ranges...", "[WARN] Subdomain cdn.enterprise.com \u2192 dangling CNAME detected", "[HIGH] Subdomain takeover opportunity confirmed", "[INFO] Correlating findings with CVE database...", "[CRIT] Attack path identified: sub3 \u2192 Jenkins \u2192 RCE (CVSS 9.8)", "[SYS]  Generating executive report... standby"];
const consoleEl = document.getElementById('console-scroll');
let evIdx = 0;

function formatTime() {
  return new Date().toISOString().slice(11,19);
}

function getLogClass(line) {
  if (line.includes('[CRIT]')) return 'log-CRIT';
  if (line.includes('[HIGH]')) return 'log-HIGH';
  if (line.includes('[WARN]')) return 'log-WARN';
  if (line.includes('[SYS]'))  return 'log-SYS';
  if (line.includes('[SCAN]')) return 'log-SCAN';
  return 'log-INFO';
}

function pushLog(line) {
  const div = document.createElement('div');
  div.className = `log-line ${getLogClass(line)}`;
  div.innerHTML = `<span class="ts">${formatTime()}</span>${line}`;
  div.style.animationDelay = '0ms';
  consoleEl.appendChild(div);
  consoleEl.scrollTop = consoleEl.scrollHeight;
  // Keep max 30 lines
  while (consoleEl.children.length > 30) consoleEl.removeChild(consoleEl.firstChild);
}

// Feed events with staggered timing
(function feed() {
  if (evIdx < events.length) {
    pushLog(events[evIdx++]);
    setTimeout(feed, 600 + Math.random() * 800);
  } else {
    // Loop with random filler after
    setInterval(() => {
      const fillers = [
        '[SCAN] Probing next IP range...', '[INFO] Fingerprinting services...',
        '[WARN] Rate limit detected — rotating UA', '[SCAN] Resolving MX records...',
        '[INFO] Passive recon via Shodan API...', '[SYS]  Memory: 214MB / CPU: 2.1%',
      ];
      pushLog(fillers[Math.floor(Math.random() * fillers.length)]);
    }, 4000);
  }
})();

// ── WINDOW RESIZE ─────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  const nW = window.innerWidth, nH = window.innerHeight;
  svg.attr('width', nW).attr('height', nH);
  sim.force('center', d3.forceCenter(nW/2, (nH-56-160)/2));
  sim.alpha(0.3).restart();
});
</script>
