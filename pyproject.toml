[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptwall"
version = "0.1.0"
description = "PromptWall - Professional attack surface evaluation and reconnaissance platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Haiagari", email = "samuell.secure@gmail.com"}
]
keywords = ["reconnaissance", "intelligence", "audit", "assessment", "scanning", "security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "sqlalchemy>=2.0",
    "requests>=2.31",
    "rich>=13.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "cryptography>=42.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]
postgres = [
    "psycopg2-binary>=2.9",
]
redis = [
    "redis>=5.0",
]

[project.scripts]
promptwall = "cli.ozy:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "src*", "backend*", "ui*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "/tmp/PromptWall/.pytest_cache"
norecursedirs = [
    "tools",
    "runtime",
    "sdd",
    ".atl",
    "openspec",
]
