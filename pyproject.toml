[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ozyrecon"
version = "6.0.0-alpha.1"
description = "OzyRecon - Advanced Persistent Reconnaissance Platform (Phantom Blade)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SamBleed", email = "sam@example.com"}
]
keywords = ["reconnaissance", "bugbounty", "offensive-security", "pentesting", "stealth"]
classifiers = [
    "Development Status :: 5 - Production/Stable", # Elevamos status!
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "sqlalchemy>=2.0",
    "requests>=2.31",
    "rich>=13.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "curl_cffi>=0.7.0",
    "prompt_toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
]

[project.scripts]
ozy = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "src*", "backend*", "ui*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
