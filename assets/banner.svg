<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <defs>
    <!-- Deep space background -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#020508"/>
    </radialGradient>
    <!-- Green glow -->
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <!-- Cyan glow left -->
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <!-- scanline texture -->
    <pattern id="scanlines" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="2" fill="rgba(0,0,0,0.15)"/>
    </pattern>
    <!-- grid -->
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ff8815" stroke-width="0.5"/>
    </pattern>
    <!-- text glow filter -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="titleGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="owlGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Grid overlay -->
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.7"/>

  <!-- Glow orbs -->
  <ellipse cx="920" cy="320" rx="350" ry="280" fill="url(#glow1)"/>
  <ellipse cx="180" cy="300" rx="250" ry="220" fill="url(#glow2)"/>

  <!-- Scanlines -->
  <rect width="1280" height="640" fill="url(#scanlines)" opacity="0.4"/>

  <!-- ═══════════ PIXEL ART OWL (left side) ═══════════ -->
  <!-- Pixel grid: each "pixel" is 12x12 -->
  <!-- Owl body - dark silhouette with glowing accents -->
  <g transform="translate(90, 140)" filter="url(#owlGlow)">
    <!-- Owl outline / body -->
    <!-- Ears (tufts) -->
    <rect x="48" y="0" width="24" height="12" fill="#00ff88"/>
    <rect x="120" y="0" width="24" height="12" fill="#00ff88"/>
    <rect x="36" y="12" width="12" height="12" fill="#00ff88"/>
    <rect x="144" y="12" width="12" height="12" fill="#00ff88"/>

    <!-- Head top -->
    <rect x="48" y="12" width="96" height="12" fill="#00ff88"/>

    <!-- Head row 2 -->
    <rect x="36" y="24" width="120" height="12" fill="#00ff88"/>

    <!-- Eyes row -->
    <rect x="36" y="36" width="12" height="12" fill="#00ff88"/>
    <!-- left eye -->
    <rect x="48" y="36" width="36" height="24" fill="#00d4ff"/>
    <rect x="60" y="42" width="12" height="12" fill="#ffffff"/>
    <!-- right eye -->
    <rect x="108" y="36" width="36" height="24" fill="#00d4ff"/>
    <rect x="120" y="42" width="12" height="12" fill="#ffffff"/>
    <rect x="144" y="36" width="12" height="12" fill="#00ff88"/>

    <!-- Beak -->
    <rect x="84" y="60" width="24" height="12" fill="#ffd700"/>
    <rect x="84" y="48" width="24" height="12" fill="#00ff88"/>

    <!-- Body row -->
    <rect x="36" y="72" width="120" height="12" fill="#00ff88"/>
    <rect x="24" y="84" width="144" height="12" fill="#00ff88"/>
    <rect x="24" y="96" width="144" height="12" fill="#00a066"/>
    <!-- chest pattern -->
    <rect x="72" y="96" width="48" height="12" fill="#00ff88"/>
    <rect x="24" y="108" width="144" height="12" fill="#00a066"/>
    <rect x="60" y="108" width="72" height="12" fill="#00ff88"/>
    <rect x="24" y="120" width="144" height="12" fill="#00a066"/>
    <rect x="48" y="120" width="96" height="12" fill="#00ff88"/>
    <rect x="24" y="132" width="144" height="12" fill="#007a50"/>

    <!-- Wings spread -->
    <rect x="0" y="84" width="24" height="60" fill="#007a50"/>
    <rect x="168" y="84" width="24" height="60" fill="#007a50"/>
    <rect x="0" y="144" width="36" height="12" fill="#007a50"/>
    <rect x="156" y="144" width="36" height="12" fill="#007a50"/>

    <!-- Legs/talons -->
    <rect x="60" y="144" width="24" height="24" fill="#00ff88"/>
    <rect x="108" y="144" width="24" height="24" fill="#00ff88"/>
    <!-- talons -->
    <rect x="48" y="168" width="12" height="12" fill="#ffd700"/>
    <rect x="60" y="168" width="12" height="12" fill="#ffd700"/>
    <rect x="72" y="168" width="12" height="12" fill="#ffd700"/>
    <rect x="96" y="168" width="12" height="12" fill="#ffd700"/>
    <rect x="108" y="168" width="12" height="12" fill="#ffd700"/>
    <rect x="120" y="168" width="12" height="12" fill="#ffd700"/>

    <!-- Floating code block beside owl -->
    <rect x="220" y="60" width="180" height="120" rx="4" fill="#0a1a12" stroke="#00ff88" stroke-width="1"/>
    <text x="230" y="80" fill="#00ff88" font-size="10" font-family="monospace">$ python3 ozyrec...</text>
    <text x="230" y="96" fill="#00d4ff" font-size="10" font-family="monospace">[*] HUNT MODE</text>
    <text x="230" y="112" fill="#00ff88" font-size="10" font-family="monospace">[+] 47 subdomains</text>
    <text x="230" y="128" fill="#ffd700" font-size="10" font-family="monospace">[!] SQLi found</text>
    <text x="230" y="144" fill="#00ff88" font-size="10" font-family="monospace">[+] OPSEC: ✓</text>
    <text x="230" y="160" fill="#00d4ff" font-size="10" font-family="monospace">[~] Scanning...</text>
    <!-- cursor blink -->
    <rect x="288" y="152" width="8" height="10" fill="#00ff88" opacity="0.9"/>
  </g>

  <!-- ═══════════ STARS / particles ═══════════ -->
  <circle cx="550" cy="40" r="2" fill="#00ff88" opacity="0.6"/>
  <circle cx="700" cy="25" r="1.5" fill="#00d4ff" opacity="0.5"/>
  <circle cx="820" cy="55" r="2" fill="#ffffff" opacity="0.3"/>
  <circle cx="960" cy="30" r="1" fill="#00ff88" opacity="0.7"/>
  <circle cx="1100" cy="50" r="2" fill="#ffd700" opacity="0.4"/>
  <circle cx="1200" cy="20" r="1.5" fill="#00d4ff" opacity="0.5"/>
  <circle cx="480" cy="580" r="1.5" fill="#00ff88" opacity="0.4"/>
  <circle cx="1150" cy="570" r="2" fill="#00d4ff" opacity="0.4"/>
  <circle cx="400" cy="35" r="1" fill="#ff6b6b" opacity="0.5"/>
  <circle cx="1050" cy="600" r="1.5" fill="#00ff88" opacity="0.3"/>

  <!-- ═══════════ DECORATIVE circuit lines ═══════════ -->
  <!-- Top left corner -->
  <polyline points="0,60 60,60 60,30 120,30" fill="none" stroke="#00ff8830" stroke-width="1.5"/>
  <circle cx="120" cy="30" r="3" fill="#00ff88" opacity="0.5"/>
  <!-- Bottom right corner -->
  <polyline points="1280,580 1220,580 1220,610 1160,610" fill="none" stroke="#00d4ff30" stroke-width="1.5"/>
  <circle cx="1160" cy="610" r="3" fill="#00d4ff" opacity="0.5"/>
  <!-- Top right -->
  <polyline points="1280,80 1200,80 1200,50" fill="none" stroke="#00ff8820" stroke-width="1"/>

  <!-- ═══════════ MAIN TITLE: OzyRecon ═══════════ -->
  <!-- Shadow/glow layer -->
  <text x="560" y="270" text-anchor="middle" font-family="'Courier New', monospace" font-size="112" font-weight="900" fill="#00ff88" opacity="0.08" letter-spacing="-2">OzyRecon</text>
  <!-- Main title -->
  <text x="560" y="260" text-anchor="middle" font-family="'Courier New', monospace" font-size="110" font-weight="900" letter-spacing="-2" filter="url(#titleGlow)">
    <tspan fill="#00ff88">Ozy</tspan><tspan fill="#00d4ff">Recon</tspan>
  </text>

  <!-- Version badge -->
  <rect x="830" y="182" width="88" height="26" rx="4" fill="#00ff88" opacity="0.15" stroke="#00ff88" stroke-width="1"/>
  <text x="874" y="200" text-anchor="middle" font-family="monospace" font-size="13" fill="#00ff88" font-weight="bold">v4.0.0</text>

  <!-- ═══════════ TAGLINE ═══════════ -->
  <text x="560" y="305" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" fill="#00d4ff" opacity="0.9" filter="url(#textGlow)" letter-spacing="3">LOCAL-FIRST · OFFENSIVE · INTELLIGENCE</text>

  <!-- ═══════════ BADGES ROW ═══════════ -->
  <!-- Badge: Hunt -->
  <rect x="388" y="345" width="76" height="24" rx="4" fill="#1a2f1a" stroke="#00ff88" stroke-width="1"/>
  <text x="426" y="361" text-anchor="middle" font-family="monospace" font-size="11" fill="#00ff88">🎯 HUNT</text>

  <!-- Badge: OPSEC -->
  <rect x="474" y="345" width="82" height="24" rx="4" fill="#1a2a2f" stroke="#00d4ff" stroke-width="1"/>
  <text x="515" y="361" text-anchor="middle" font-family="monospace" font-size="11" fill="#00d4ff">🥷 OPSEC</text>

  <!-- Badge: Python -->
  <rect x="566" y="345" width="82" height="24" rx="4" fill="#2a2a1a" stroke="#ffd700" stroke-width="1"/>
  <text x="607" y="361" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffd700">🐍 Python</text>

  <!-- Badge: MIT -->
  <rect x="658" y="345" width="64" height="24" rx="4" fill="#1a1a2f" stroke="#a78bfa" stroke-width="1"/>
  <text x="690" y="361" text-anchor="middle" font-family="monospace" font-size="11" fill="#a78bfa">📄 MIT</text>

  <!-- Badge: BugBounty -->
  <rect x="732" y="345" width="100" height="24" rx="4" fill="#2f1a1a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="782" y="361" text-anchor="middle" font-family="monospace" font-size="11" fill="#ff6b6b">🐛 BugBounty</text>

  <!-- ═══════════ MODES GRID (bottom center) ═══════════ -->
  <!-- Mode pills -->
  <g transform="translate(400, 410)">
    <!-- HUNT -->
    <rect x="0" y="0" width="64" height="20" rx="3" fill="#00ff8820"/>
    <text x="32" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ff88">HUNT</text>
    <!-- CONTINUO -->
    <rect x="72" y="0" width="76" height="20" rx="3" fill="#00d4ff20"/>
    <text x="110" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#00d4ff">CONTINUO</text>
    <!-- CAMPAÑA -->
    <rect x="156" y="0" width="76" height="20" rx="3" fill="#ffd70020"/>
    <text x="194" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffd700">CAMPAÑA</text>
    <!-- FORENSE -->
    <rect x="240" y="0" width="76" height="20" rx="3" fill="#ff6b6b20"/>
    <text x="278" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff6b6b">FORENSE</text>
    <!-- SERVICIO -->
    <rect x="324" y="0" width="76" height="20" rx="3" fill="#a78bfa20"/>
    <text x="362" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#a78bfa">SERVICIO</text>
  </g>

  <!-- ═══════════ RIGHT SIDE: floating terminal ═══════════ -->
  <g transform="translate(930, 180)">
    <!-- Terminal window -->
    <rect x="0" y="0" width="310" height="260" rx="8" fill="#050d08" stroke="#00ff88" stroke-width="1.5" opacity="0.95"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="310" height="28" rx="8" fill="#0a1f10"/>
    <rect x="0" y="14" width="310" height="14" fill="#0a1f10"/>
    <!-- Window buttons -->
    <circle cx="20" cy="14" r="5" fill="#ff5f57"/>
    <circle cx="36" cy="14" r="5" fill="#febc2e"/>
    <circle cx="52" cy="14" r="5" fill="#28c840"/>
    <!-- Terminal title -->
    <text x="155" y="19" text-anchor="middle" font-family="monospace" font-size="11" fill="#00ff8880">ozyrec · hunt · target.com</text>
    <!-- Terminal content -->
    <text x="16" y="52" font-family="monospace" font-size="11" fill="#00ff88">$ python3 src/cli/main.py hunt \</text>
    <text x="16" y="68" font-family="monospace" font-size="11" fill="#00ff88">  -t target.com</text>
    <text x="16" y="90" font-family="monospace" font-size="11" fill="#4ade80">[*] OzyRecon v4.0 initializing...</text>
    <text x="16" y="106" font-family="monospace" font-size="11" fill="#00d4ff">[*] OPSEC: jitter ON | UA rotation ON</text>
    <text x="16" y="122" font-family="monospace" font-size="11" fill="#4ade80">[+] Subdomains discovered: 47</text>
    <text x="16" y="138" font-family="monospace" font-size="11" fill="#4ade80">[+] Open ports: 12 hosts</text>
    <text x="16" y="154" font-family="monospace" font-size="11" fill="#ffd700">[!] CRITICAL: SQLi → /api/v1/user</text>
    <text x="16" y="170" font-family="monospace" font-size="11" fill="#ffd700">[!] HIGH: XSS → /search?q=</text>
    <text x="16" y="186" font-family="monospace" font-size="11" fill="#00d4ff">[*] Nuclei: running 847 templates</text>
    <text x="16" y="202" font-family="monospace" font-size="11" fill="#4ade80">[+] CVE-2024-1234 confirmed ✓</text>
    <text x="16" y="218" font-family="monospace" font-size="11" fill="#a78bfa">[~] Telegram alert sent</text>
    <text x="16" y="234" font-family="monospace" font-size="11" fill="#00ff88">[+] Session saved → memory.db</text>
    <text x="16" y="250" font-family="monospace" font-size="11" fill="#00ff88">▮</text>
  </g>

  <!-- ═══════════ BOTTOM SEPARATOR LINE ═══════════ -->
  <line x1="100" y1="490" x2="1180" y2="490" stroke="#00ff8820" stroke-width="1"/>

  <!-- ═══════════ BOTTOM BAR: credit + stack ═══════════ -->
  <text x="180" y="520" font-family="monospace" font-size="12" fill="#00ff8860">Built with ❤️ for Bug Hunters · github.com/SamBleed/OzyRecon</text>

  <!-- Stack icons text -->
  <text x="180" y="545" font-family="monospace" font-size="11" fill="#00ff8840">Python · SQLite · Nuclei · Dalfox · Shodan · Telegram · Gemini · Claude</text>

  <!-- Bottom right branding -->
  <text x="1200" y="545" text-anchor="end" font-family="monospace" font-size="12" fill="#00ff8840">@SamBleed</text>

  <!-- Corner decorations -->
  <!-- Top-left bracket -->
  <polyline points="20,20 20,10 30,10" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.6"/>
  <!-- Top-right bracket -->
  <polyline points="1260,20 1260,10 1250,10" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.6"/>
  <!-- Bottom-left bracket -->
  <polyline points="20,620 20,630 30,630" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.6"/>
  <!-- Bottom-right bracket -->
  <polyline points="1260,620 1260,630 1250,630" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.6"/>
</svg>
