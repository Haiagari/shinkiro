# Filtros OPSEC para PromptWall
# Añade aquí patrones que NO deben subirse al repositorio

blocked_patterns:
  # Dominios geográficos sensibles
  - '\.edu\.pe'
  - '\.gob\.pe'
  - '\.edu\.cl'
  - '\.gov'
  
  # Palabras clave de clientes (ejemplos)
  - 'bancomeco'
  - 'entidad-privada'

  # Secretos y credenciales (mejorados para evitar falsos positivos en código)
  - 'api_key\s*[:=]\s*["''][a-zA-Z0-9\-_]{16,}["'']'
  - 'db_password\s*[:=]\s*["''][a-zA-Z0-9\-_]{8,}["'']'
  - 'token\s*[:=]\s*["''][a-zA-Z0-9\-_]{16,}["'']'


# Archivos que están permitidos aunque contengan patrones (ej: documentación pública)
allowed_files:
  - 'README.md'
  - 'DISCLAIMER.md'
  - 'docs/architecture.md'
  - 'docs/opsec.md'
