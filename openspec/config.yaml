# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Python 3.10+, SQLAlchemy 2.0, FastAPI, Rich, Click
  Architecture: Modular (src/core, src/modes, src/intelligence, src/opsec, src/validation)
  Testing: pytest 9.0.3 + pytest-asyncio
  Style: ruff (linting), black (formatting)

strict_tdd: true

rules:
  proposal:
    - Always include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  Test Runner: pytest 9.0.3
  Test Layers:
    - Unit: AVAILABLE
    - Integration: AVAILABLE (pytest + httpx/re-requests-mock)
    - E2E: NOT INSTALLED (no playwright in pyproject.toml)
  Coverage: NOT INSTALLED (no pytest-cov in dependencies)
  Quality Tools:
    - Linter: ruff AVAILABLE
    - Type checker: mypy (NOT INSTALLED)
    - Formatter: black IN PROJECT but NOT INSTALLED in venv