# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Python 3.11+ (running 3.14.4), SQLAlchemy 2.0, FastAPI, Rich, Click, Jinja2, WeasyPrint
  Architecture: Modular monolith (src/core, src/modes, src/intelligence, src/validation, src/storage)
  Testing: pytest 9.0.3 (158 tests across 38 files)
  Style: ruff + black (in pyproject.toml but NOT in venv)

strict_tdd: true

rules:
  proposal:
    - Always include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  Test Runner: pytest 9.0.3
  Test Layers:
    - Unit: AVAILABLE (tests/core/, tests/discovery/, tests/export/, tests/reporting/)
    - Integration: AVAILABLE (tests/integration/, tests/test_api_integration.py)
    - E2E: AVAILABLE (tests/test_runtime_end_to_end.py)
  Coverage: NOT INSTALLED in venv (CI installs pytest-cov dynamically)
  Quality Tools:
    - Linter: ruff (in pyproject.toml but NOT in venv)
    - Type checker: mypy NOT INSTALLED
    - Formatter: black (in pyproject.toml but NOT in venv)
  CI/CD: GitHub Actions (installs pytest-cov, bandit in pipeline)