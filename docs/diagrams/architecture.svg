<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="none"/>
  <text x="600" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1A237E">OzyRecon — Hexagonal Architecture</text>
  <text x="600" y="55" text-anchor="middle" font-size="14" fill="#666666">Ports &amp; Adapters Pattern</text>
  
  <!-- CLI Layer -->
  <rect x="40" y="80" width="180" height="320" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="130" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">CLI LAYER</text>
  <rect x="60" y="120" width="140" height="45" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="130" y="147" text-anchor="middle" font-size="11" fill="#000000">⚙️ ozy.py · Click CLI</text>
  <rect x="60" y="180" width="140" height="45" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="130" y="207" text-anchor="middle" font-size="11" fill="#000000">📋 22 Commands</text>
  <rect x="60" y="240" width="140" height="45" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="130" y="267" text-anchor="middle" font-size="11" fill="#000000">🔧 Normalization Utils</text>
  <rect x="60" y="300" width="140" height="45" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="130" y="327" text-anchor="middle" font-size="11" fill="#000000">🖥️ Interactive Mode</text>
  
  <!-- Core Layer -->
  <rect x="280" y="80" width="220" height="320" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="390" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">CORE LAYER</text>
  <rect x="300" y="120" width="180" height="45" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="390" y="147" text-anchor="middle" font-size="11" fill="#000000">🔑 Bootstrap · DI Container</text>
  <rect x="300" y="180" width="180" height="45" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="390" y="207" text-anchor="middle" font-size="11" fill="#000000">📐 Config · YAML + Env</text>
  <rect x="300" y="240" width="180" height="45" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="390" y="267" text-anchor="middle" font-size="11" fill="#000000">🎯 Target Normalizer</text>
  <rect x="300" y="300" width="180" height="45" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="390" y="327" text-anchor="middle" font-size="11" fill="#000000">⏱️ Rate Limiter</text>
  
  <!-- Application Layer -->
  <rect x="560" y="80" width="220" height="320" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="670" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">APPLICATION LAYER</text>
  <rect x="580" y="120" width="180" height="45" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="670" y="147" text-anchor="middle" font-size="11" fill="#000000">🔄 Orchestration</text>
  <rect x="580" y="180" width="180" height="45" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="670" y="207" text-anchor="middle" font-size="11" fill="#000000">🔍 Use Cases</text>
  <rect x="580" y="240" width="180" height="45" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="670" y="267" text-anchor="middle" font-size="11" fill="#000000">📡 Ports (Interfaces)</text>
  <rect x="580" y="300" width="180" height="45" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="670" y="327" text-anchor="middle" font-size="11" fill="#000000">🛡️ Policy Engine</text>
  
  <!-- Domain Layer -->
  <rect x="840" y="80" width="180" height="320" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="930" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">DOMAIN LAYER</text>
  <rect x="860" y="120" width="140" height="45" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="930" y="147" text-anchor="middle" font-size="11" fill="#000000">📦 Asset · Finding</text>
  <rect x="860" y="180" width="140" height="45" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="930" y="207" text-anchor="middle" font-size="11" fill="#000000">📄 Evidence · Scan</text>
  <rect x="860" y="240" width="140" height="45" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="930" y="267" text-anchor="middle" font-size="11" fill="#000000">🔐 Events (Immutable)</text>
  
  <!-- Adapters Layer -->
  <rect x="40" y="430" width="980" height="120" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="530" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">ADAPTERS LAYER (External Integrations)</text>
  <rect x="60" y="470" width="120" height="55" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="120" y="492" text-anchor="middle" font-size="10" fill="#000000">🗄️ SQLite</text>
  <text x="120" y="507" text-anchor="middle" font-size="10" fill="#000000">SQLAlchemy</text>
  <rect x="200" y="470" width="140" height="55" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="270" y="492" text-anchor="middle" font-size="10" fill="#000000">🔍 Go Tools</text>
  <text x="270" y="507" text-anchor="middle" font-size="10" fill="#000000">subfinder · httpx</text>
  <rect x="360" y="470" width="140" height="55" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="430" y="492" text-anchor="middle" font-size="10" fill="#000000">🌐 HTTP Client</text>
  <text x="430" y="507" text-anchor="middle" font-size="10" fill="#000000">curl_cffi · stealth</text>
  <rect x="520" y="470" width="120" height="55" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="580" y="492" text-anchor="middle" font-size="10" fill="#000000">📡 APIs</text>
  <text x="580" y="507" text-anchor="middle" font-size="10" fill="#000000">Shodan · VT</text>
  <rect x="660" y="470" width="120" height="55" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="720" y="492" text-anchor="middle" font-size="10" fill="#000000">📣 Notifications</text>
  <text x="720" y="507" text-anchor="middle" font-size="10" fill="#000000">Telegram</text>
  <rect x="800" y="470" width="120" height="55" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="860" y="492" text-anchor="middle" font-size="10" fill="#000000">📄 Reports</text>
  <text x="860" y="507" text-anchor="middle" font-size="10" fill="#000000">PDF · JSON</text>
  
  <!-- Flow Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c8ebf"/>
    </marker>
  </defs>
  <line x1="220" y1="240" x2="280" y2="240" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="240" x2="560" y2="240" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="240" x2="840" y2="240" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M670 365 L670 390 L530 390 L530 430" stroke="#6c8ebf" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
</svg>
