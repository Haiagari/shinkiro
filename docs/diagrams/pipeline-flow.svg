<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1200" height="550" fill="none"/>
  <text x="600" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1A237E">OzyRecon — Reconnaissance Pipeline</text>
  <text x="600" y="55" text-anchor="middle" font-size="14" fill="#666666">5-Phase Execution Flow</text>
  
  <!-- INPUT -->
  <rect x="40" y="80" width="160" height="300" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="120" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">INPUT</text>
  <rect x="60" y="120" width="120" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="120" y="145" text-anchor="middle" font-size="10" fill="#000000">🎯 Target Domain</text>
  <rect x="60" y="180" width="120" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="120" y="205" text-anchor="middle" font-size="10" fill="#000000">📋 Scope Rules</text>
  <rect x="60" y="240" width="120" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="120" y="265" text-anchor="middle" font-size="10" fill="#000000">⚙️ Config YAML</text>
  <rect x="60" y="300" width="120" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="120" y="325" text-anchor="middle" font-size="10" fill="#000000">🔑 API Keys</text>
  
  <!-- ENUMERATION -->
  <rect x="240" y="80" width="180" height="300" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="330" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">ENUMERATION</text>
  <rect x="260" y="120" width="140" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="330" y="145" text-anchor="middle" font-size="10" fill="#000000">🔍 Subfinder</text>
  <rect x="260" y="180" width="140" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="330" y="205" text-anchor="middle" font-size="10" fill="#000000">🌐 Amass</text>
  <rect x="260" y="240" width="140" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="330" y="265" text-anchor="middle" font-size="10" fill="#000000">📡 DNSx</text>
  <rect x="260" y="300" width="140" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="330" y="325" text-anchor="middle" font-size="10" fill="#000000">🔗 Katana</text>
  
  <!-- SCANNING -->
  <rect x="460" y="80" width="180" height="300" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="550" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">SCANNING</text>
  <rect x="480" y="120" width="140" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="550" y="145" text-anchor="middle" font-size="10" fill="#000000">🌐 Httpx</text>
  <rect x="480" y="180" width="140" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="550" y="205" text-anchor="middle" font-size="10" fill="#000000">🔌 Naabu</text>
  <rect x="480" y="240" width="140" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="550" y="265" text-anchor="middle" font-size="10" fill="#000000">🛡️ Nuclei</text>
  <rect x="480" y="300" width="140" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="550" y="325" text-anchor="middle" font-size="10" fill="#000000">📸 GoWitness</text>
  
  <!-- ANALYSIS -->
  <rect x="680" y="80" width="180" height="300" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="770" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">ANALYSIS</text>
  <rect x="700" y="120" width="140" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="770" y="145" text-anchor="middle" font-size="10" fill="#000000">📊 Deduplication</text>
  <rect x="700" y="180" width="140" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="770" y="205" text-anchor="middle" font-size="10" fill="#000000">🏷️ Classification</text>
  <rect x="700" y="240" width="140" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="770" y="265" text-anchor="middle" font-size="10" fill="#000000">🔗 Correlation</text>
  <rect x="700" y="300" width="140" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="770" y="325" text-anchor="middle" font-size="10" fill="#000000">📝 Evidence</text>
  
  <!-- OUTPUT -->
  <rect x="900" y="80" width="180" height="300" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="990" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">OUTPUT</text>
  <rect x="920" y="120" width="140" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="990" y="145" text-anchor="middle" font-size="10" fill="#000000">🗄️ SQLite DB</text>
  <rect x="920" y="180" width="140" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="990" y="205" text-anchor="middle" font-size="10" fill="#000000">📄 Reports</text>
  <rect x="920" y="240" width="140" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="990" y="265" text-anchor="middle" font-size="10" fill="#000000">📤 Export JSON</text>
  <rect x="920" y="300" width="140" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="990" y="325" text-anchor="middle" font-size="10" fill="#000000">📣 Telegram</text>
  
  <!-- Flow Arrows -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6c8ebf"/>
    </marker>
  </defs>
  <line x1="200" y1="230" x2="240" y2="230" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="420" y1="230" x2="460" y2="230" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="640" y1="230" x2="680" y2="230" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="860" y1="230" x2="900" y2="230" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arr)"/>
  
  <!-- Legend -->
  <rect x="40" y="420" width="1040" height="50" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/>
  <text x="60" y="450" font-size="11" font-weight="bold" fill="#424242">Pipeline Phases:</text>
  <rect x="200" y="435" width="16" height="16" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="225" y="448" font-size="10" fill="#424242">Input</text>
  <rect x="290" y="435" width="16" height="16" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="315" y="448" font-size="10" fill="#424242">Enumeration</text>
  <rect x="410" y="435" width="16" height="16" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="435" y="448" font-size="10" fill="#424242">Scanning</text>
  <rect x="520" y="435" width="16" height="16" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="545" y="448" font-size="10" fill="#424242">Analysis</text>
  <rect x="630" y="435" width="16" height="16" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="655" y="448" font-size="10" fill="#424242">Output</text>
  <text x="780" y="448" font-size="10" fill="#757575">Tools: subfinder · amass · dnsx · httpx · naabu · nuclei · katana · gowitness</text>
</svg>
