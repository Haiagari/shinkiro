<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" style="background:#070b13; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10192d" stroke-width="1" />
    </pattern>
    
    <!-- Neon Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#0a121e" />
    </linearGradient>

    <linearGradient id="card-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190e2e" />
      <stop offset="100%" stop-color="#0c0717" />
    </linearGradient>

    <linearGradient id="card-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a261d" />
      <stop offset="100%" stop-color="#05140e" />
    </linearGradient>

    <linearGradient id="card-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0d15" />
      <stop offset="100%" stop-color="#140509" />
    </linearGradient>

    <linearGradient id="card-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1a0d" />
      <stop offset="100%" stop-color="#140c05" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00f2fe" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#9d4edd" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00ff87" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ff0055" />
    </marker>
  </defs>

  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="#070b13" />
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.8" />

  <!-- HEADER -->
  <text x="60" y="55" fill="#f8fafc" font-size="24" font-weight="700" letter-spacing="1">SHINKIRO (蜃気楼) — CYBER DECEPTION &amp; ATTACKER INTEL MESH</text>
  <text x="60" y="80" fill="#64748b" font-size="14">In-Memory Ephemeral Honeynet Mesh • Zero-Footprint Telemetry • Kernel eBPF/XDP Defense</text>

  <!-- ==================== COLUMN 1: ADVERSARY INGRESS ==================== -->
  <g transform="translate(60, 120)">
    <!-- Boundary Box -->
    <rect width="220" height="710" rx="14" fill="#0c101c" stroke="#ff0055" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />
    <text x="20" y="32" fill="#ff0055" font-size="13" font-weight="700" letter-spacing="0.5">ZONE 1: ADVERSARY VECTORS</text>

    <!-- External Attacker Box -->
    <rect x="20" y="55" width="180" height="85" rx="8" fill="url(#card-red)" stroke="#ff0055" stroke-width="1.5" />
    <text x="35" y="88" fill="#ff0055" font-size="15" font-weight="700">Adversary Scanner</text>
    <text x="35" y="108" fill="#94a3b8" font-size="11">Automated Bots &amp; Shodan</text>
    <text x="35" y="123" fill="#cbd5e1" font-size="10">SYN / TCP / UDP Floods</text>

    <!-- Attack Vectors Container -->
    <rect x="20" y="165" width="180" height="95" rx="8" fill="#0e1322" stroke="#334155" stroke-width="1" />
    <text x="32" y="195" fill="#f1f5f9" font-size="12" font-weight="600">Cloud &amp; IMDS Traps</text>
    <text x="32" y="215" fill="#64748b" font-size="11">AWS IMDSv1/v2 (:8169)</text>
    <text x="32" y="232" fill="#00f2fe" font-size="10">SSRF Credential Harvest</text>

    <rect x="20" y="280" width="180" height="95" rx="8" fill="#0e1322" stroke="#334155" stroke-width="1" />
    <text x="32" y="310" fill="#f1f5f9" font-size="12" font-weight="600">Container APIs</text>
    <text x="32" y="330" fill="#64748b" font-size="11">Docker API (:2375)</text>
    <text x="32" y="347" fill="#64748b" font-size="11">Kubernetes API (:6443)</text>

    <rect x="20" y="395" width="180" height="95" rx="8" fill="#0e1322" stroke="#334155" stroke-width="1" />
    <text x="32" y="425" fill="#f1f5f9" font-size="12" font-weight="600">Shells &amp; Botnets</text>
    <text x="32" y="445" fill="#64748b" font-size="11">SSH OpenSSH (:2222)</text>
    <text x="32" y="462" fill="#64748b" font-size="11">Telnet BusyBox (:2323)</text>

    <rect x="20" y="510" width="180" height="95" rx="8" fill="#0e1322" stroke="#334155" stroke-width="1" />
    <text x="32" y="540" fill="#f1f5f9" font-size="12" font-weight="600">Database &amp; Storage</text>
    <text x="32" y="560" fill="#64748b" font-size="11">Redis RESP (:6379)</text>
    <text x="32" y="577" fill="#64748b" font-size="11">PostgreSQL &amp; Mongo</text>

    <rect x="20" y="625" width="180" height="70" rx="8" fill="#0e1322" stroke="#334155" stroke-width="1" />
    <text x="32" y="652" fill="#f1f5f9" font-size="12" font-weight="600">IoT &amp; Lateral Lures</text>
    <text x="32" y="672" fill="#64748b" font-size="11">MQTT (:1883) &amp; SMB (:4445)</text>
  </g>

  <!-- CONNECTING ARROWS ZONE 1 -> ZONE 2 -->
  <path d="M 280 230 L 340 230" stroke="#00f2fe" stroke-width="1.5" marker-end="url(#arrow-cyan)" />
  <path d="M 280 345 L 340 345" stroke="#00f2fe" stroke-width="1.5" marker-end="url(#arrow-cyan)" />
  <path d="M 280 460 L 340 460" stroke="#00f2fe" stroke-width="1.5" marker-end="url(#arrow-cyan)" />
  <path d="M 280 575 L 340 575" stroke="#00f2fe" stroke-width="1.5" marker-end="url(#arrow-cyan)" />

  <!-- ==================== COLUMN 2: SHINKIRO CORE ENGINE ==================== -->
  <g transform="translate(350, 120)">
    <!-- Platform Boundary -->
    <rect width="360" height="710" rx="14" fill="#0a101f" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.8" />
    <text x="25" y="32" fill="#00f2fe" font-size="13" font-weight="700" letter-spacing="0.5">ZONE 2: SHINKIRO ZERO-FOOTPRINT CORE</text>

