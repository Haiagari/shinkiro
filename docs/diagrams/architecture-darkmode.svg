    <text x="45" y="115" fill="#94a3b8" font-size="12">• Non-Root Ephemeral Port Mapping</text>
    <text x="45" y="135" fill="#94a3b8" font-size="12">• Goroutine Isolation &amp; Deadlines (30s)</text>
    <text x="45" y="155" fill="#38bdf8" font-size="12" font-weight="600">Throughput: &gt;87 Million ops/sec</text>

    <!-- Raw PCAP Engine Card -->
    <rect x="25" y="210" width="310" height="85" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="45" y="240" fill="#38bdf8" font-size="14" font-weight="600">Zero-Copy Libpcap 2.4 Engine</text>
    <text x="45" y="262" fill="#94a3b8" font-size="11">Raw TCP/UDP frame dump to data/dump.pcap</text>
    <text x="45" y="278" fill="#64748b" font-size="10">Forensic Wire Analysis &amp; Wireshark Ready</text>

    <!-- Memory-Jailed Decoys Grid -->
    <rect x="25" y="315" width="310" height="375" rx="10" fill="#0a1222" stroke="#1e293b" stroke-width="1" />
    <text x="45" y="342" fill="#f8fafc" font-size="13" font-weight="700">14 High-Interaction Protocol Emulators</text>
    <text x="45" y="360" fill="#64748b" font-size="11">No real host shells • Sandboxed VirtualFS</text>

