      <text x="12" y="20" fill="#f1f5f9" font-size="11" font-weight="600">SSH VirtualFS</text>
      <text x="12" y="34" fill="#64748b" font-size="9">Bash TTY &amp; Auth</text>

      <rect x="140" y="0" width="125" height="42" rx="6" fill="#131e36" stroke="#00f2fe" stroke-width="0.8" />
      <text x="152" y="20" fill="#f1f5f9" font-size="11" font-weight="600">Telnet BusyBox</text>
      <text x="152" y="34" fill="#64748b" font-size="9">Mirai Harvester</text>

      <!-- Row 2 -->
      <rect x="0" y="52" width="125" height="42" rx="6" fill="#131e36" stroke="#00f2fe" stroke-width="0.8" />
      <text x="12" y="72" fill="#f1f5f9" font-size="11" font-weight="600">Redis RESP</text>
      <text x="12" y="86" fill="#64748b" font-size="9">Lua EVAL Hasher</text>

      <rect x="140" y="52" width="125" height="42" rx="6" fill="#131e36" stroke="#00f2fe" stroke-width="0.8" />
      <text x="152" y="72" fill="#f1f5f9" font-size="11" font-weight="600">Docker REST</text>
      <text x="152" y="86" fill="#64748b" font-size="9">Miner Interception</text>

      <!-- Row 3 -->
      <rect x="0" y="104" width="125" height="42" rx="6" fill="#131e36" stroke="#00f2fe" stroke-width="0.8" />
      <text x="12" y="124" fill="#f1f5f9" font-size="11" font-weight="600">Kubernetes API</text>
      <text x="12" y="138" fill="#64748b" font-size="9">RBAC &amp; Secrets</text>

      <rect x="140" y="104" width="125" height="42" rx="6" fill="#131e36" stroke="#00f2fe" stroke-width="0.8" />
      <text x="152" y="124" fill="#f1f5f9" font-size="11" font-weight="600">AWS IMDS</text>
      <text x="152" y="138" fill="#64748b" font-size="9">HMAC Canary Bait</text>

      <!-- Row 4 -->
      <rect x="0" y="156" width="125" height="42" rx="6" fill="#131e36" stroke="#00f2fe" stroke-width="0.8" />
      <text x="12" y="176" fill="#f1f5f9" font-size="11" font-weight="600">Postgres &amp; Mongo</text>
      <text x="12" y="190" fill="#64748b" font-size="9">Wire Protocol 3.0</text>

      <rect x="140" y="156" width="125" height="42" rx="6" fill="#131e36" stroke="#00f2fe" stroke-width="0.8" />
      <text x="152" y="176" fill="#f1f5f9" font-size="11" font-weight="600">MQTT 3.1.1</text>
      <text x="152" y="190" fill="#64748b" font-size="9">IoT Broker Trap</text>

      <!-- Row 5 -->
      <rect x="0" y="208" width="125" height="42" rx="6" fill="#131e36" stroke="#00f2fe" stroke-width="0.8" />
      <text x="12" y="228" fill="#f1f5f9" font-size="11" font-weight="600">SMBv2 Engine</text>
      <text x="12" y="242" fill="#64748b" font-size="9">EternalBlue Trap</text>

      <rect x="140" y="208" width="125" height="42" rx="6" fill="#131e36" stroke="#00f2fe" stroke-width="0.8" />
      <text x="152" y="228" fill="#f1f5f9" font-size="11" font-weight="600">HTTP Honeytraps</text>
      <text x="152" y="242" fill="#64748b" font-size="9">/.env &amp; Git configs</text>

      <!-- Row 6 -->
      <rect x="0" y="260" width="125" height="42" rx="6" fill="#131e36" stroke="#00f2fe" stroke-width="0.8" />
      <text x="12" y="280" fill="#f1f5f9" font-size="11" font-weight="600">Elasticsearch</text>
      <text x="12" y="294" fill="#64748b" font-size="9">Cluster &amp; Indices</text>

      <rect x="140" y="260" width="125" height="42" rx="6" fill="#131e36" stroke="#00f2fe" stroke-width="0.8" />
      <text x="152" y="280" fill="#f1f5f9" font-size="11" font-weight="600">SMTP &amp; DNS</text>
      <text x="152" y="294" fill="#64748b" font-size="9">Phishing / Recon</text>
    </g>
  </g>

  <!-- ARROWS ZONE 2 -> ZONE 3 -->
  <path d="M 710 320 L 780 320" stroke="#9d4edd" stroke-width="2" marker-end="url(#arrow-purple)" />
  <path d="M 710 520 L 780 520" stroke="#9d4edd" stroke-width="2" marker-end="url(#arrow-purple)" />

  <!-- ==================== COLUMN 3: THREAT INTEL PIPELINE ==================== -->
  <g transform="translate(790, 120)">
    <!-- Platform Boundary -->
    <rect width="360" height="710" rx="14" fill="#100b1e" stroke="#9d4edd" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.8" />
    <text x="25" y="32" fill="#9d4edd" font-size="13" font-weight="700" letter-spacing="0.5">ZONE 3: REAL-TIME THREAT INTEL</text>

    <!-- Threat Intelligence Engine Card -->
    <rect x="25" y="55" width="310" height="145" rx="10" fill="url(#card-purple)" stroke="#9d4edd" stroke-width="2" filter="url(#glow-purple)" />
    <text x="45" y="90" fill="#c77dff" font-size="17" font-weight="700">Threat Intelligence Engine</text>
    <text x="45" y="115" fill="#e2e8f0" font-size="12">• Event Ingestion: 13.40 ns / op</text>
    <text x="45" y="135" fill="#e2e8f0" font-size="12">• Zero Memory Allocations (0 B/op)</text>
    <text x="45" y="155" fill="#e2e8f0" font-size="12">• Cryptographic SHA-256 Payload Hash</text>
    <text x="45" y="175" fill="#c77dff" font-size="12" font-weight="600">Dynamic Score: 0 - 100 Risk Rating</text>

    <!-- GeoIP & ASN Enrichment -->
    <rect x="25" y="225" width="310" height="95" rx="8" fill="#160e29" stroke="#7b2cbf" stroke-width="1.5" />
    <text x="45" y="255" fill="#e0aaff" font-size="14" font-weight="600">Offline GeoIP &amp; ASN Resolver</text>
    <text x="45" y="278" fill="#94a3b8" font-size="11">Fast B-Tree in-memory lookups without WAN</text>
    <text x="45" y="295" fill="#cbd5e1" font-size="10">Resolves Country, City, ASN, Org instantly</text>

    <!-- Distributed Cluster Mesh Hub -->
    <rect x="25" y="345" width="310" height="95" rx="8" fill="#160e29" stroke="#7b2cbf" stroke-width="1.5" />
    <text x="45" y="375" fill="#e0aaff" font-size="14" font-weight="600">Cluster Mesh Hub (:8443)</text>
    <text x="45" y="398" fill="#94a3b8" font-size="11">Multi-node edge sensor aggregation</text>
    <text x="45" y="415" fill="#cbd5e1" font-size="10">Mutual TLS sync / REST ingestion API</text>

    <!-- Synthetic Canary Keys Generator -->
    <rect x="25" y="465" width="310" height="95" rx="8" fill="#160e29" stroke="#7b2cbf" stroke-width="1.5" />
    <text x="45" y="495" fill="#e0aaff" font-size="14" font-weight="600">HMAC Canary Honeytokens</text>
    <text x="45" y="518" fill="#94a3b8" font-size="11">Deterministic cryptographic AWS IAM keys</text>
    <text x="45" y="535" fill="#cbd5e1" font-size="10">Alerts when adversary exfiltrates &amp; tests keys</text>

    <!-- Adversary Simulator -->
    <rect x="25" y="585" width="310" height="105" rx="8" fill="#160e29" stroke="#ff0055" stroke-width="1.5" />
    <text x="45" y="615" fill="#ff4d6d" font-size="14" font-weight="600">Red Team Attack Simulator</text>
    <text x="45" y="638" fill="#94a3b8" font-size="11">Automated probe validation (`shinkiro simulate`)</text>
    <text x="45" y="655" fill="#cbd5e1" font-size="10">Continuous detection posture verification</text>
  </g>

  <!-- ARROWS ZONE 3 -> ZONE 4 -->
  <path d="M 1150 240 L 1220 240" stroke="#00ff87" stroke-width="2" marker-end="url(#arrow-green)" />
  <path d="M 1150 480 L 1220 480" stroke="#00ff87" stroke-width="2" marker-end="url(#arrow-green)" />
  <path d="M 1150 640 L 1220 640" stroke="#ff0055" stroke-width="2" marker-end="url(#arrow-red)" />

  <!-- ==================== COLUMN 4: DEFENSE & OBSERVABILITY ==================== -->
  <g transform="translate(1230, 120)">
    <!-- Platform Boundary -->
    <rect width="310" height="710" rx="14" fill="#081412" stroke="#00ff87" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.8" />
    <text x="25" y="32" fill="#00ff87" font-size="13" font-weight="700" letter-spacing="0.5">ZONE 4: DEFENSE &amp; OBSERVABILITY</text>

    <!-- Kernel eBPF/XDP Defense -->
    <rect x="20" y="55" width="270" height="135" rx="10" fill="url(#card-green)" stroke="#00ff87" stroke-width="2" filter="url(#glow-green)" />
    <text x="35" y="90" fill="#00ff87" font-size="16" font-weight="700">Native eBPF / XDP Driver</text>
    <text x="35" y="112" fill="#e2e8f0" font-size="11">• Kernel C Driver (xdp_drop.c)</text>
    <text x="35" y="130" fill="#e2e8f0" font-size="11">• BPF Map Blacklist (65k entries)</text>
    <text x="35" y="148" fill="#e2e8f0" font-size="11">• Drops packet at NIC before socket</text>
    <text x="35" y="168" fill="#6ee7b7" font-size="11" font-weight="600">Threshold: Threat Score &gt;= 95</text>

    <!-- Firewall Automation -->
    <rect x="20" y="210" width="270" height="90" rx="8" fill="#0a1a15" stroke="#10b981" stroke-width="1.5" />
    <text x="35" y="240" fill="#10b981" font-size="14" font-weight="600">nftables / iptables Sets</text>
    <text x="35" y="262" fill="#94a3b8" font-size="11">Automated blocklist exports &amp; CIDR</text>
    <text x="35" y="280" fill="#6ee7b7" font-size="11" font-weight="600">Threshold: Threat Score &gt;= 80</text>

    <!-- STIX 2.1 & ECS Feeds -->
    <rect x="20" y="320" width="270" height="95" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="35" y="350" fill="#38bdf8" font-size="14" font-weight="600">SIEM &amp; Threat Feeds</text>
    <text x="35" y="372" fill="#e2e8f0" font-size="11">• STIX 2.1 JSON Bundles</text>
    <text x="35" y="390" fill="#e2e8f0" font-size="11">• Elastic Common Schema (ECS v8.x)</text>

    <!-- Metrics & Dashboards -->
    <rect x="20" y="435" width="270" height="95" rx="8" fill="#1c120c" stroke="#f59e0b" stroke-width="1.5" />
    <text x="35" y="465" fill="#f59e0b" font-size="14" font-weight="600">Prometheus &amp; Grafana</text>
    <text x="35" y="488" fill="#e2e8f0" font-size="11">• Metrics Exporter (:9100/metrics)</text>
    <text x="35" y="506" fill="#e2e8f0" font-size="11">• Decoy Hit Rates &amp; Block Counters</text>

    <!-- Interactive TUI -->
    <rect x="20" y="550" width="270" height="65" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
    <text x="35" y="578" fill="#818cf8" font-size="13" font-weight="600">Live Terminal TUI</text>
    <text x="35" y="598" fill="#94a3b8" font-size="11">Bubbletea interactive SecOps console</text>

    <!-- SecOps Webhooks -->
    <rect x="20" y="630" width="270" height="65" rx="8" fill="#200d1c" stroke="#ec4899" stroke-width="1.5" />
    <text x="35" y="658" fill="#f472b6" font-size="13" font-weight="600">Slack &amp; Discord Alerts</text>
    <text x="35" y="678" fill="#94a3b8" font-size="11">Block Kit &amp; Rich Embed notifications</text>
  </g>

  <!-- RETURN MITIGATION PATH (Active Defense drop back to Attacker) -->
  <path d="M 1230 115 C 800 -20, 250 -20, 150 120" stroke="#ff0055" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow-red)" />
  <rect x="620" y="8" width="260" height="26" rx="6" fill="#140509" stroke="#ff0055" stroke-width="1" />
  <text x="635" y="25" fill="#ff0055" font-size="11" font-weight="700">KERNEL XDP DROP / NIC DISCARD</text>

</svg>
