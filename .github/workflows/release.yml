name: Release & Supply Chain Security

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  build-and-sign:
    name: Build, SBOM, Sign & SLSA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.0

      - name: Install Syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@v0.17.9

      - name: Build Binary
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -buildid= -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/shinkiro-linux-amd64 ./cmd/shinkiro
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/shinkiro-linux-arm64 ./cmd/shinkiro
          cd dist && sha256sum shinkiro-* > checksums.txt

      - name: Generate SPDX & CycloneDX SBOMs
        run: |
          syft dir:. -o spdx-json=dist/shinkiro-sbom.spdx.json
          syft dir:. -o cyclonedx-json=dist/shinkiro-sbom.cdx.json

      - name: Sign Checksums and Binaries with Cosign (Keyless Sigstore)
        run: |
          cosign sign-blob --yes --bundle dist.checksums.bundle dist/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/shinkiro-linux-amd64
            dist/shinkiro-linux-arm64
            dist/checksums.txt
            dist/checksums.bundle
            dist/shinkiro-sbom.spdx.json
            dist/shinkiro-sbom.cdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
