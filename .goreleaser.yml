# NOTE: Not used by current CI (.github/workflows/release.yml).
# Release workflow builds raw binaries: shinkiro-linux-amd64 / shinkiro-linux-arm64
# (+ checksums.txt, SBOMs, cosign on checksums). This file is retained for a
# possible future GoReleaser migration. ldflags below reference main.version /
# main.commit / main.date, which are not declared in cmd/shinkiro/main.go today.

version: 2

project_name: shinkiro

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: shinkiro
    main: ./cmd/shinkiro/main.go
    binary: shinkiro
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    builds:
      - shinkiro
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - config.yaml

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
